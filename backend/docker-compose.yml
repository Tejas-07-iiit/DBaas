version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dbaas-api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL:-postgresql://dbaas:dbaas_secret@postgres:5432/dbaas_platform?schema=public}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL}
      - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY}
      - INFRASTRUCTURE_PROVIDER=${INFRASTRUCTURE_PROVIDER:-central-management}
      - MANAGEMENT_API_URL=${MANAGEMENT_API_URL:-http://192.168.122.7:8080}
      - CENTRAL_MANAGEMENT_URL=${CENTRAL_MANAGEMENT_URL:-http://192.168.122.7:8080}
      - CENTRAL_MANAGEMENT_API_KEY=${CENTRAL_MANAGEMENT_API_KEY}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-DBaaS Cloud <no-reply@dbaas.local>}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_mock_key_id}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-rzp_test_mock_key_secret}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-rzp_test_webhook_secret}
      - RAZORPAY_MODE=${RAZORPAY_MODE:-test}
      - PAYMENT_ENABLED=${PAYMENT_ENABLED:-true}
    command: >
      sh -c "npx prisma migrate deploy && node dist/main"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dbaas-network

  postgres:
    image: postgres:16-alpine
    container_name: dbaas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dbaas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dbaas_secret}
      POSTGRES_DB: ${POSTGRES_DB:-dbaas_platform}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dbaas} -d ${POSTGRES_DB:-dbaas_platform}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dbaas-network

  redis:
    image: redis:7-alpine
    container_name: dbaas-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dbaas-network

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  dbaas-network:
    driver: bridge
