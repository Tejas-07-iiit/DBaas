version: '3.8'

services:
  # ============================================================================
  # 1. FRONTEND: Next.js 16 Web Dashboard (Standalone Container)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dbaas-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    environment:
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      - backend
    networks:
      - dbaas-network

  # ============================================================================
  # 2. BACKEND: NestJS Control Plane & Gateway
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dbaas-api
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=3000
    command: >
      sh -c "npx prisma migrate deploy && node dist/main"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dbaas-network

  # ============================================================================
  # 3. PLATFORM DATABASE: PostgreSQL 16
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: dbaas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dbaas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dbaas_secret}
      POSTGRES_DB: ${POSTGRES_DB:-dbaas_platform}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dbaas} -d ${POSTGRES_DB:-dbaas_platform}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dbaas-network

  # ============================================================================
  # 4. QUEUE & CACHE: Redis 7
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: dbaas-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dbaas-network

volumes:
  postgres-data:
  redis-data:

networks:
  dbaas-network:
    driver: bridge
